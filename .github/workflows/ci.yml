name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: latest-known
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run --locked ruff check src scripts tests
      - run: uv run --locked mypy src/logbook_cli
      - name: Unit and offline integration tests (including coordination and Herdr)
        run: uv run --locked python -m unittest discover tests
      - name: Build package
        run: uv build
      - name: CLI smoke checks
        run: |
          ./bin/lb --help
          ./bin/lb --version
