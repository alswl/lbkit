name: CI

on:
  push:
    branches: [master]
    tags: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Tests (ubuntu-latest, Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: latest-known
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run --locked ruff check src scripts tests
      - run: uv run --locked mypy src/logbook_cli
      - name: Unit and offline integration tests (including coordination and Herdr)
        run: uv run --locked python -m unittest discover tests
      - name: Build package
        run: uv build
      - name: CLI smoke checks
        run: |
          ./bin/lb --help
          ./bin/lb --version
