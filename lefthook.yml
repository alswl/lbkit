pre-commit:
  commands:
    ruff:
      glob:
        - "*.py"
        - "**/*.py"
        - "bin/lb"
      run: uv run --locked ruff check {staged_files}

pre-push:
  commands:
    ruff:
      run: uv run --locked ruff check src scripts tests
    mypy:
      run: uv run --locked mypy src/logbook_cli
